<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discogs Style Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #eef1f2;
            --panel: #ffffff;
            --ink: #14181c;
            --muted: #6b7480;
            --line: #d7dce2;
            --accent: hsl(176 62% 34%);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #14171c;
                --panel: #1b1f26;
                --ink: #eceef1;
                --muted: #8a93a1;
                --line: #2a2f37;
                --accent: hsl(176 62% 60%);
            }
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--paper); overflow: hidden; }

        .header {
            height: 80px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            position: relative;
        }


        .title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .title-text-stack {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-group h1 {
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans Condensed', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-group p {
            margin: 2px 0 0 0;
            padding: 0;
            font-size: 15px;
            color: var(--muted);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo {
            height: 36px;
            width: auto;
        }
        .viewport {
            height: calc(100vh - 70px);
            width: 100%;
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 760px) {
            body, html {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .viewport {
                height: calc(100dvh - 80px);
                min-height: 640px;
            }

            .title-group p {
                display: none;
            }
        }
    </style>
</head>
<body>
  <header class="header">
      <div class="title-group">
          <img src="discogs_icon.svg" alt="Discogs Logo" class="logo">
          
          <div class="title-text-stack">
              <h1>Discogs Subgenre Map</h1>
              <p>Explore neighbors of your favorite subgenres</p>
          </div>
      </div>
      <div id="external-controls"></div>
  </header>
    <main class="viewport">
        <iframe src="style_Node2Vec_masters_umap.html" id="plot-frame"></iframe>
    </main>
</body>
</html>
