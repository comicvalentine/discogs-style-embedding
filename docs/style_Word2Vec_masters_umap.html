<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* Discogs Style Map — visual tokens
   Ground: cool blue-grey paper, not warm cream. Accent: teal, reserved for
   interactive chrome only. Genre colors are per-genre (hue, sat, light)
   triples set inline by map.js (see genre_palette() in visual.py) rather
   than one hue rotation at fixed sat/light — adjacent hues alone weren't
   distinct enough at 15 categories, so lightness/saturation also step
   between genres to add a second and third channel of separation. */

:root {
  --paper: #eef1f2;
  --panel: #ffffff;
  --ink: #14181c;
  --muted: #6b7480;
  --line: #d7dce2;

  --accent-hue: 176;
  --accent-sat: 62%;
  --accent-light: 34%;
  --accent: hsl(var(--accent-hue) var(--accent-sat) var(--accent-light));
  --accent-soft: hsl(var(--accent-hue) 45% 93%);

  --radius-sm: 4px;
  --radius-md: 7px;
  --shadow-float: 0 2px 6px rgba(20, 24, 28, 0.10), 0 12px 28px rgba(20, 24, 28, 0.10);

  --font-label: "IBM Plex Sans Condensed", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14171c;
    --panel: #1b1f26;
    --ink: #eceef1;
    --muted: #8a93a1;
    --line: #2a2f37;
    --accent-light: 60%;
    --accent-soft: hsl(var(--accent-hue) 40% 18%);
    --shadow-float: 0 2px 8px rgba(0, 0, 0, 0.45), 0 16px 32px rgba(0, 0, 0, 0.4);
  }

  /* Genre swatches read the same --hue/--sat/--light triple set inline by
     map.js; dark mode brightens+saturates it a bit rather than needing a
     second palette from Python. */
  .genre-fill {
    fill: hsl(var(--hue) calc(var(--sat) + 6%) calc(var(--light) + 24%));
  }
  .genre-bg {
    background: hsl(var(--hue) calc(var(--sat) + 6%) calc(var(--light) + 24%));
  }
}

.genre-fill { fill: hsl(var(--hue) var(--sat) var(--light)); }
.genre-bg { background: hsl(var(--hue) var(--sat) var(--light)); }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}

.map-app {
  display: grid;
  grid-template-columns: 1fr minmax(180px, 22%);
  grid-template-rows: auto 1fr;
  gap: 14px;
  width: 100%;
  height: 100%;
  padding: 16px;
}

.toolbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.field {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

.field svg { flex: none; color: var(--muted); }

#search-input {
  border: none;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12.5px;
  width: 160px;
}

#search-input::placeholder { color: var(--muted); }

.field:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}

.btn:hover { border-color: var(--muted); }
.btn svg { color: var(--muted); }

.toggle {
  display: flex;
  align-items: center;
  height: 34px;
  padding: 0 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.toggle button {
  border: none;
  background: transparent;
  height: 26px;
  padding: 0 10px;
  font-family: var(--font-label);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  border-radius: 3px;
  cursor: pointer;
}

.toggle button.is-active {
  background: var(--ink);
  color: var(--panel);
}

.stat {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.stage {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr minmax(180px, 22%);
  gap: 14px;
  min-height: 0;
}

.map-frame {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: grab;
}

.map-frame.is-dragging { cursor: grabbing; }

.map-frame svg { display: block; width: 100%; height: 100%; }

.point circle {
  stroke: var(--panel);
  stroke-width: 1.2px;
  cursor: pointer;
  transition: r 0.12s ease;
}

.point:hover circle { r: 6.5; }

.point text {
  font-family: var(--font-label);
  font-size: 10px;
  font-weight: 500;
  fill: var(--ink);
  paint-order: stroke;
  stroke: var(--panel);
  stroke-width: 3px;
  stroke-linejoin: round;
  pointer-events: none;
  transform: translateY(-9px);
  text-anchor: middle;
}

.map-app.labels-off .point text { display: none; }

.map-app.genre-dim .point.is-dimmed circle { opacity: 0.15; }
.map-app.genre-dim .point.is-dimmed text { display: none; }

.ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.5px;
  pointer-events: none;
  opacity: 0.9;
}

.tooltip {
  position: absolute;
  z-index: 30;
  min-width: 160px;
  max-width: 240px;
  padding: 10px 12px;
  background: var(--panel);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-float);
  pointer-events: none;
  opacity: 0;
  transform: translateY(2px);
  transition: opacity 0.1s ease;
}

.tooltip.is-visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.tooltip-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-label);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.tooltip-swatch {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex: none;
}

.tooltip-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  padding: 2px 0;
}

.tooltip-row .pct {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

.tooltip-bar {
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  margin-top: 2px;
  overflow: hidden;
}

.tooltip-bar > span { display: block; height: 100%; }

.tooltip-button {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 7px 8px;
  background: var(--accent);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.15s ease;
}

.tooltip-button:active {
  opacity: 0.85;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px;
}

.panel-title {
  font-family: var(--font-label);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 10px;
}

.minimap {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--paper);
  border: 1px solid var(--line);
}

.minimap svg { display: block; width: 100%; height: 100%; }

.viewfinder {
  position: absolute;
  border: 1.5px solid var(--accent);
  background: hsl(var(--accent-hue) 60% 55% / 0.08);
  pointer-events: none;
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  max-height: 320px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 4px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

.legend-item:hover { background: var(--paper); }

.legend-chip {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex: none;
}

.legend-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.legend-count {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.legend-item.is-off { opacity: 0.35; }
.legend-item.is-off .legend-chip { filter: grayscale(1); }

@media (max-width: 760px) {
  .map-app {
    grid-template-columns: 1fr;
    padding: 10px;
    height: auto;
    min-height: 100%;
  }

  .stage {
    grid-template-columns: 1fr;
  }

  .map-frame { height: min(70vh, 560px); }

  .sidebar { flex-direction: row; flex-wrap: wrap; }
  .sidebar .panel { flex: 1 1 220px; }

  .stat { display: none; }
}

</style>
</head>

<div class="map-app">
  <div class="toolbar">

  </div>
</div>

      scale,
      project: (dx, dy) => [cx + (dx - dcx) * scale, cy - (dy - dcy) * scale],
      invert: (px, py) => [dcx + (px - cx) / scale, dcy - (py - cy) / scale],
    };
  }

  let width = 0;
  let height = 0;
  let projector = null;
  let currentTransform = d3.zoomIdentity;

  const zoom = d3.zoom().scaleExtent([0.4, 60]).on("zoom", (event) => {
    currentTransform = event.transform;
    render();
  });

  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("mousedown.cursor", () => frame.classList.add("is-dragging"));
  svg.on("mouseup.cursor mouseleave.cursor", () => frame.classList.remove("is-dragging"));

  const pointsSel = worldG
    .selectAll("g.point")
    .data(points)
    .join("g")
    .attr("class", "point")
    .attr("data-genre", (d) => d.genre)
    .on("mouseenter", (event, d) => {
      if (!isTouch) showTooltip(event, d, false);
    })
    .on("mousemove", (event) => {
      if (!isTouch) moveTooltip(event);
    })
    .on("mouseleave", () => {
      if (!isTouch) hideTooltip();
    })
    .on("click", (event, d) => {
      // No hover on touch, so a tap opens the tooltip (which carries its own
      // Discogs link) instead of navigating away immediately.
      if (isTouch) {
        event.stopPropagation();
        showTooltip(event, d, true);
      } else {
        window.open(discogsUrl(d), "_blank", "noopener");
      }
    });

  const pointCircles = pointsSel.append("circle").attr("class", "genre-fill").attr("r", 4.5);
  applyGenreVars(pointCircles, (d) => d.genre);

  pointsSel.append("text").text((d) => d.style);

  function render() {
    worldG.attr("transform", currentTransform);
    const k = currentTransform.k;
    pointsSel.attr("transform", (d) => `translate(${d.px},${d.py}) scale(${1 / k})`);
    updateMinimap();
  }

  function repositionPoints() {
    points.forEach((d) => {
      const [px, py] = projector.project(d.dim0, d.dim1);
      d.px = px;
      d.py = py;
    });
  }

  function zoomTo(px, py, k, animate) {
    const tx = width / 2 - k * px;
    const ty = height / 2 - k * py;
    const t = d3.zoomIdentity.translate(tx, ty).scale(k);
    const sel = animate ? svg.transition().duration(500) : svg;
    sel.call(zoom.transform, t);
  }

  function fitAll(animate) {
    zoomTo(width / 2, height / 2, 1, animate);
  }

  function resize(applyInitial) {
    const newWidth = frame.clientWidth;
    const newHeight = frame.clientHeight;
    if (!newWidth || !newHeight) return;

    // Capture the currently visible data-space window (center + zoom level)
    // under the OLD projector/transform before either changes, so a resize
    // (e.g. rotating a phone) keeps showing the same place instead of
    // stranding all points outside the new viewBox.
    let preserved = null;
    if (projector && !applyInitial) {
      const k = currentTransform.k;
      const centerData = projector.invert(
        (width / 2 - currentTransform.x) / k,
        (height / 2 - currentTransform.y) / k
      );
      preserved = { centerData, dataPerPixel: 1 / (projector.scale * k) };
    }

    width = newWidth;
    height = newHeight;
    svg.attr("viewBox", `0 0 ${width} ${height}`);
    projector = makeProjector(width, height, 0.1);
    repositionPoints();

    if (applyInitial) {
      const focus = points.find((d) => d.style.toLowerCase() === DATA.init.style.toLowerCase());
      if (focus) {
        const k = Math.min(60, Math.max(0.4, 1 / DATA.init.marginPct));
        zoomTo(focus.px, focus.py, k, false);
        return;
      }
    }

    if (preserved) {
      const newK = Math.min(60, Math.max(0.4, 1 / (projector.scale * preserved.dataPerPixel)));
      const [wx, wy] = projector.project(preserved.centerData[0], preserved.centerData[1]);
      zoomTo(wx, wy, newK, false);
      return;
    }

    render();
  }

  // --- tooltip ---
  function discogsUrl(d) {
    return `https://www.discogs.com/search?type=master&page=1&style_exact=${encodeURIComponent(d.style)}&sort=have%2Cdesc`;
  }

  function showTooltip(event, d, withButton) {
    const styleVars = (genre) => {
      const p = paletteOf(genre);
      return `--hue:${p.hue}deg; --sat:${p.sat}%; --light:${p.light}%;`;
    };
    const rows = d.hover
      .map(
        ([genre, pct]) => `
        <div class="tooltip-row">
          <span>${genre.replace(/_/g, " ")}</span>
          <span class="pct">${(pct * 100).toFixed(0)}%</span>
        </div>
        <div class="tooltip-bar"><span class="genre-bg" style="width:${(pct * 100).toFixed(0)}%; ${styleVars(genre)}"></span></div>`
      )
      .join("");
    const button = withButton
      ? `<button class="tooltip-button" data-url="${discogsUrl(d)}">Go to Discogs</button>`
      : "";
    tooltip.innerHTML = `
      <div class="tooltip-title">
        <span class="tooltip-swatch genre-bg" style="${styleVars(d.genre)}"></span>
        ${d.style}
      </div>
      ${rows}
      ${button}`;
    tooltip.classList.add("is-visible");
    moveTooltip(event);
  }

  function moveTooltip(event) {
    const rect = frame.getBoundingClientRect();
    let left = event.clientX - rect.left + 14;
    let top = event.clientY - rect.top + 14;
    if (left + 240 > rect.width) left = event.clientX - rect.left - 254;
    if (top + 140 > rect.height) top = event.clientY - rect.top - 154;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function hideTooltip() {
    tooltip.classList.remove("is-visible");
  }

  // --- search ---
  const normalize = (s) => (s || "").toLowerCase().replace(/[-_\s]+/g, "");

  function runSearch() {
    const term = normalize(searchInput.value);
    if (!term) return;
    const match = points.find((d) => normalize(d.style) === term);
    if (!match) {
      searchInput.classList.add("is-error");
      setTimeout(() => searchInput.classList.remove("is-error"), 900);
      return;
    }
    zoomTo(match.px, match.py, Math.max(currentTransform.k, 6), true);
    pulseRing(match);
  }

  function pulseRing(d) {
    svg.selectAll(".ring").remove();
    const ring = worldG
      .append("circle")
      .attr("class", "ring")
      .attr("cx", d.px)
      .attr("cy", d.py)
      .attr("r", 14);
    ring
      .transition()
      .duration(600)
      .attr("r", 26)
      .style("opacity", 0)
      .transition()
      .delay(200)
      .duration(600)
      .attr("r", 14)
      .style("opacity", 1)
      .on("end", function repeat() {
        d3.select(this)
          .transition()
          .duration(600)
          .attr("r", 26)
          .style("opacity", 0)
          .transition()
          .delay(200)
          .duration(600)
          .attr("r", 14)
          .style("opacity", 1)
          .on("end", repeat);
      });
    setTimeout(() => ring.remove(), 3200);
  }

  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearch();
  });

  resetBtn.addEventListener("click", () => fitAll(true));

  labelsOnBtn.addEventListener("click", () => setLabels(true));
  labelsOffBtn.addEventListener("click", () => setLabels(false));

  function setLabels(on) {
    app.classList.toggle("labels-off", !on);
    labelsOnBtn.classList.toggle("is-active", on);
    labelsOffBtn.classList.toggle("is-active", !on);
  }

  // --- legend ---
  const genreCounts = d3.rollup(points, (v) => v.length, (d) => d.genre);
  const genreList = Array.from(genreCounts, ([genre, count]) => ({ genre, count }))
    .sort((a, b) => b.count - a.count);

  genreList.forEach(({ genre, count }) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    const p = paletteOf(genre);
    item.innerHTML = `
      <span class="legend-chip genre-bg" style="--hue:${p.hue}deg; --sat:${p.sat}%; --light:${p.light}%;"></span>
      <span class="legend-name">${genre.replace(/_/g, " ")}</span>
      <span class="legend-count">${count}</span>`;
    item.addEventListener("click", () => {
      if (hiddenGenres.has(genre)) hiddenGenres.delete(genre);
      else hiddenGenres.add(genre);
      item.classList.toggle("is-off", hiddenGenres.has(genre));
      applyGenreFilter();
    });
    legendEl.appendChild(item);
  });

  function applyGenreFilter() {
    app.classList.toggle("genre-dim", hiddenGenres.size > 0);
    pointsSel.classed("is-dimmed", (d) => hiddenGenres.has(d.genre));
  }

  // --- minimap (static projection, redrawn once; only the viewfinder moves) ---
  let miniProjector = null;

  function buildMinimap() {
    const el = document.querySelector(".minimap");
    const mw = el.clientWidth;
    const mh = el.clientHeight;
    miniSvg.attr("viewBox", `0 0 ${mw} ${mh}`);
    miniProjector = makeProjector(mw, mh, 0.08);
    const miniCircles = miniSvg
      .selectAll("circle")
      .data(points)
      .join("circle")
      .attr("class", "genre-fill")
      .attr("cx", (d) => miniProjector.project(d.dim0, d.dim1)[0])
      .attr("cy", (d) => miniProjector.project(d.dim0, d.dim1)[1])
      .attr("r", 2.6)
      .style("opacity", 0.55);
    applyGenreVars(miniCircles, (d) => d.genre);
  }

  function updateMinimap() {
    if (!miniProjector || !projector) return;
    const k = currentTransform.k;
    const tx = currentTransform.x;
    const ty = currentTransform.y;

    const c1 = projector.invert((0 - tx) / k, (0 - ty) / k);
    const c2 = projector.invert((width - tx) / k, (height - ty) / k);
    const dataX = [Math.min(c1[0], c2[0]), Math.max(c1[0], c2[0])];
    const dataY = [Math.min(c1[1], c2[1]), Math.max(c1[1], c2[1])];

    const m1 = miniProjector.project(dataX[0], dataY[0]);
    const m2 = miniProjector.project(dataX[1], dataY[1]);
    const el = document.querySelector(".minimap");
    const mw = el.clientWidth;
    const mh = el.clientHeight;

    const left = Math.max(0, Math.min(m1[0], m2[0]));
    const top = Math.max(0, Math.min(m1[1], m2[1]));
    const w = Math.min(mw, Math.abs(m2[0] - m1[0]));
    const h = Math.min(mh, Math.abs(m2[1] - m1[1]));

    viewfinder.style.left = `${left}px`;
    viewfinder.style.top = `${top}px`;
    viewfinder.style.width = `${w}px`;
    viewfinder.style.height = `${h}px`;
  }

  document.addEventListener("click", (e) => {
    if (isTouch && !tooltip.contains(e.target)) hideTooltip();
  });

  tooltip.addEventListener("click", (e) => {
    if (e.target.classList.contains("tooltip-button")) {
      window.open(e.target.dataset.url, "_blank", "noopener");
    }
  });

  // --- boot ---
  buildMinimap();
  resize(true);

  const ro = new ResizeObserver(() => resize(false));
  ro.observe(frame);
  window.addEventListener("resize", () => buildMinimap());
})();

</script>
</body>
</html>
